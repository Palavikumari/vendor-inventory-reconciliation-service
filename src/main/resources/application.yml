server:
  port: 8081

spring:
  application:
    name: vendor-inventory-reconciliation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/virs_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.company.virs: DEBUG
    org.flywaydb: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

  file:
    name: logs/virs.log

virs:
  vendor:
    api-key: ${VENDOR_API_KEY:local-dev-api-key}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:virs-inventory}

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}


