server:
  port: 8081

spring:
  application:
    name: vendor-inventory-reconciliation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/virs_db
db:
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.company.virs: DEBUG
    org.flywaydb: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

  file:
    name: logs/virs.log

virs:
  vendor:
    api-key: local-dev-api-key

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: virs-inventory

slack:
  webhook-url: https://hooks.slack.com/services/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