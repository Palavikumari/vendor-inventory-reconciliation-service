server:
  port: 8081

spring:
  application:
    name: vendor-inventory-reconciliation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/virs_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.company.virs: INFO

  file:
    name: logs/virs.log

virs:
  processing:
    batch-size: 500
    thread-count: 4
    max-file-size-bytes: 10485760

  vendor:
    api-key: ${VENDOR_API_KEY:local-dev-api-key}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:virs-inventory}

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}